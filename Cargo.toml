[workspace]
resolver = "2"
members = [
    "crates/*",
    "benchmarks",
]
exclude = [
    # Overstep: HTTP REST API → songBird owns network transport (PRIMAL_RESPONSIBILITY_MATRIX V2)
    "crates/beardog-integration",
    # Overstep: Android deploy orchestration → biomeOS owns deployment (PRIMAL_RESPONSIBILITY_MATRIX V2)
    "crates/beardog-deploy",
    # Zero consumers — dormant until capability-based composition surfaces need
    "crates/beardog-node-registry",
    "crates/beardog-client",
    "crates/beardog-workflows",
    "crates/beardog-production",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.93.0"
authors = ["BearDog Team"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimals/beardog"
homepage = "https://beardog.dev"
documentation = "https://docs.beardog.dev"

[workspace.lints.rust]
# `deny` at workspace level — prevents accidental unsafe while allowing targeted
# `#[allow(unsafe_code)]` in modules that genuinely require FFI (DPAPI, libtower C ABI).
unsafe_code = "deny"
missing_docs = "warn"
deprecated = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
perf = "warn"
nursery = "warn"

# ── Promoted from allow as codebase evolved (wateringHole / autofix & cleanup) ─
wildcard_imports = { level = "warn", priority = 1 }
items_after_statements = { level = "warn", priority = 1 }
default_trait_access = { level = "warn", priority = 1 }
match_wildcard_for_single_variants = { level = "warn", priority = 1 }
needless_pass_by_ref_mut = { level = "warn", priority = 1 }
redundant_pub_crate = { level = "warn", priority = 1 }

# ── Genuinely noisy / opinionated — silenced with justification ──────────────
# Trait impls often require `self` / `async` even when unused by the impl.
unused_async = { level = "allow", priority = 1 }
unused_self = { level = "allow", priority = 1 }
# Some trait method wrappers must return Result even on infallible paths.
unnecessary_wraps = { level = "allow", priority = 1 }
# Explicit naming (e.g. `BearDogError` inside `beardog_errors`) aids grep-ability.
module_name_repetitions = { level = "allow", priority = 1 }
# `#[must_use]` on every pure function is extremely noisy for a large codebase.
must_use_candidate = { level = "allow", priority = 1 }
return_self_not_must_use = { level = "allow", priority = 1 }
# Not all PartialEq types satisfy Eq (floats, etc.).
derive_partial_eq_without_eq = { level = "allow", priority = 1 }
# `significant_drop` lints have high false-positive rates in async code.
significant_drop_tightening = { level = "allow", priority = 1 }
significant_drop_in_scrutinee = { level = "allow", priority = 1 }
# Async futures in this codebase often hold non-Send types (design choice).
future_not_send = { level = "allow", priority = 1 }
# Struct fields may intentionally share prefixes with the struct name.
struct_field_names = { level = "allow", priority = 1 }
# Debug impls intentionally omit sensitive fields.
missing_fields_in_debug = { level = "allow", priority = 1 }
# Style preferences that don't affect correctness:
similar_names = { level = "allow", priority = 1 }
option_if_let_else = { level = "allow", priority = 1 }
match_same_arms = { level = "allow", priority = 1 }
ref_option = { level = "allow", priority = 1 }
no_effect_underscore_binding = { level = "allow", priority = 1 }
used_underscore_binding = { level = "allow", priority = 1 }
used_underscore_items = { level = "allow", priority = 1 }
empty_line_after_doc_comments = { level = "allow", priority = 1 }
empty_line_after_outer_attr = { level = "allow", priority = 1 }
duplicated_attributes = { level = "allow", priority = 1 }
# `&bool` / `&u8` vs by-value: marginal perf difference, noisy on public APIs.
trivially_copy_pass_by_ref = { level = "allow", priority = 1 }
struct_excessive_bools = { level = "allow", priority = 1 }
# Many functions could be const but call non-const methods or are async-adjacent.
missing_const_for_fn = { level = "allow", priority = 1 }
# Passing by value is sometimes intentional for API ergonomics / ownership semantics.
needless_pass_by_value = { level = "allow", priority = 1 }
# `type_complexity` triggers on deeply nested generic types that are readable as-is.
type_complexity = { level = "allow", priority = 1 }
# `too_many_lines` — enforced via 1000-line file limit + PR review, not per-function.
too_many_lines = { level = "allow", priority = 1 }
# `cognitive_complexity` — tracked via crate-level metrics, not per-function lint.
cognitive_complexity = { level = "allow", priority = 1 }
# `inline_always` — specific hot paths are profiled and intentionally force-inlined.
inline_always = { level = "allow", priority = 1 }
field_reassign_with_default = { level = "allow", priority = 1 }

# ── Pedantic doc lints — promoted incrementally as doc coverage improves ──────
# PROMOTED: all public Result-returning functions must document error conditions.
missing_errors_doc = { level = "warn", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
# PROMOTED: all identifiers in doc comments must be backticked.
doc_markdown = { level = "warn", priority = 1 }
# PROMOTED from allow as codebase evolved — clean doc links / first paragraphs.
doc_link_with_quotes = { level = "warn", priority = 1 }
doc_lazy_continuation = { level = "allow", priority = 1 }
too_long_first_doc_paragraph = { level = "warn", priority = 1 }
# PROMOTED: empty doc comments are never useful — write a real sentence.
empty_docs = { level = "warn", priority = 1 }

# ── Cast safety — all truncation/precision casts must use per-site
#    #[expect(clippy::cast_*, reason = "...")] or safe conversion (From/TryFrom).
#    Promoted to warn: truncation, precision loss, lossless, sign loss. ─────────
cast_possible_truncation = { level = "warn", priority = 1 }
cast_precision_loss = { level = "warn", priority = 1 }
cast_sign_loss = { level = "warn", priority = 1 }
cast_lossless = { level = "warn", priority = 1 }
cast_possible_wrap = { level = "warn", priority = 1 }

# ── Unwrap / expect — warn at workspace level (wateringHole); catches regressions.
#    Test code uses per-crate cfg_attr(test, allow) or per-site #[expect]. ────
expect_used = { level = "warn", priority = 2 }
unwrap_used = { level = "warn", priority = 2 }

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.35", default-features = false, features = ["tracing"] }
serde = { version = "1.0", features = ["derive"] }
serial_test = "3.0"
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "2.0"
hkdf = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
ciborium = "0.2"

subtle = "2.5"
chacha20 = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async runtime
futures = "0.3"

# Cryptography (100% Pure Rust!)
ed25519-dalek = "2.1"
x25519-dalek = "2.0"
blake3 = { version = "1.5", features = ["pure"] }  # Pure Rust (no C assembly) for universal portability
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1.7", features = ["derive"] }
hmac = "0.12"
sha2 = { version = "0.10", features = ["oid"] }
sha3 = "0.10"
sha1 = "0.10"  # Legacy hashing (Git compatibility) - Phase 7
rsa = "0.9"
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
p384 = { version = "0.13", features = ["ecdsa"] }  # ECDSA P-384 (Phase 2)
# ed448-goldilocks removed: handler stubs deleted; re-add when Phase 3 activates
scrypt = "0.11"           # Memory-hard KDF - stable version (evolved from RC)
# DEFERRED Phase 7: AES legacy modes - RustCrypto RC version conflicts (like P-521/Ed448)
# aes = "0.9.0-rc.2"        # AES cipher (for CBC/CTR/XTS modes)
# cipher = "0.5.0-rc.5"     # Cipher traits (for AES modes)
# cbc = "0.2.0-rc.2"        # AES-CBC mode (TLS 1.2)
# ctr = "0.10.0-rc.2"       # AES-CTR mode (streaming)
# xts-mode = "0.5.1"        # AES-XTS mode (disk encryption)

# Networking
mdns-sd = "0.11"            # mDNS/DNS-SD service discovery (feature-gated)

# TLS termination (H2-10 sovereignty) — pure Rust via RustCrypto CryptoProvider
rustls = { version = "0.23", default-features = false, features = ["custom-provider", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-rustcrypto = { version = "0.0.2-alpha", git = "https://github.com/RustCrypto/rustls-rustcrypto" }

# Cephalization (G64): dual-protocol JSON-RPC + tarpc
tarpc = { version = "0.37", default-features = false, features = ["serde-transport-bincode", "unix"] }

# Serialization
postcard = { version = "1.0", features = ["alloc"] }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
# hidapi = "2.6"  # ❌ REMOVED - C library, replaced with Pure Rust beardog-hid
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
rand_core = { version = "0.9", features = ["os_rng"] }
rand_chacha = "0.9"
bytes = "1.5"
parking_lot = "0.12"
base64 = "0.22"
hex = "0.4"
semver = "1.0"
crossterm = "0.29"
bcrypt = "0.18"  # Legacy password hashing - Phase 7
# JWT: Implemented using RustCrypto (hmac + sha2 + base64) - 100% Pure Rust!

# Concurrent data structures
crossbeam-queue = "0.3"
dashmap = "6.2"

# Utilities
http = "1"
getrandom = "0.3"
ahash = "0.8"
ecdsa = "0.16"
x509-parser = "0.18"
x509-cert = { version = "0.2", default-features = false, features = ["builder", "pem", "std"] }
data-encoding = "2.5"
rpassword = "7.3"
whoami = "1.6"
etcetera = "0.8"
bs58 = "0.5"  # Base58 encoding for did:key multibase (Ed25519 → did:key:z6Mk...)

# Dev-only
approx = "0.5"
assert_cmd = "2.0"
predicates = "3.0"

# Error handling
color-eyre = "0.6"

# Testing
tempfile = "3.8"
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# BearDog internal crates (version + path for crates.io publishing)
beardog-types = { version = "0.9.0", path = "crates/beardog-types" }
beardog-errors = { version = "0.9.0", path = "crates/beardog-errors" }
beardog-core = { version = "0.9.0", path = "crates/beardog-core" }
beardog-crypto = { version = "0.9.0", path = "crates/beardog-crypto" }
beardog-config = { version = "0.9.0", path = "crates/beardog-config" }
beardog-tunnel = { version = "0.9.0", path = "crates/beardog-tunnel" }
beardog-auth = { version = "0.9.0", path = "crates/beardog-auth" }
beardog-genetics = { version = "0.9.0", path = "crates/beardog-genetics" }
beardog-adapters = { version = "0.9.0", path = "crates/beardog-adapters" }
beardog-monitoring = { version = "0.9.0", path = "crates/beardog-monitoring" }
beardog-ipc = { version = "0.9.0", path = "crates/beardog-ipc" }
beardog-security = { version = "0.9.0", path = "crates/beardog-security" }
beardog-traits = { version = "0.9.0", path = "crates/beardog-traits" }
beardog-utils = { version = "0.9.0", path = "crates/beardog-utils" }
beardog-cli = { version = "0.9.0", path = "crates/beardog-cli" }
beardog-capabilities = { version = "0.9.0", path = "crates/beardog-capabilities" }
beardog-hid = { version = "0.9.0", path = "crates/beardog-hid" }
beardog-tower-atomic = { version = "0.9.0", path = "crates/beardog-tower-atomic" }
beardog-discovery = { version = "0.9.0", path = "crates/beardog-discovery" }
beardog-threat = { version = "0.9.0", path = "crates/beardog-threat" }
beardog-compliance = { version = "0.9.0", path = "crates/beardog-compliance" }
beardog-acme = { version = "0.9.0", path = "crates/beardog-acme" }

# Ecosystem shared types (cellMembrane canonical definitions)
cellmembrane-types = { path = "../../gardens/cellMembrane/crates/cellmembrane-types" }

[package]
name = "beardog"
readme = "README.md"
description = "Zero-trust, sovereign cryptographic workflow orchestrator with hardware security module integration"
keywords = ["cryptography", "hsm", "security", "workflow", "sovereignty"]
categories = ["cryptography", "authentication", "network-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "beardog"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
color-eyre = { workspace = true }
beardog-core = { workspace = true }
beardog-config = { workspace = true }
beardog-types = { workspace = true }
beardog-errors = { workspace = true }
beardog-tunnel = { workspace = true }
beardog-auth = { workspace = true }
beardog-genetics = { workspace = true }
beardog-monitoring = { workspace = true }
beardog-ipc = { workspace = true }
beardog-security = { workspace = true }
beardog-traits = { workspace = true }
beardog-cli = { workspace = true }

tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

# Optional dependencies for examples
# hidapi = { workspace = true, optional = true }  # ❌ REMOVED - C library
beardog-hid = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "test-util"] }
proptest = { workspace = true }
criterion = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
serial_test = { workspace = true }
beardog-adapters = { workspace = true }
beardog-capabilities = { workspace = true }
futures = { workspace = true }
beardog-genetics = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }  # For chaos tests

[[test]]
name = "chaos"
path = "tests/chaos/mod.rs"
harness = true

[[test]]
name = "fault_injection"
path = "tests/fault_injection/mod.rs"
harness = true

[[test]]
name = "graph_security_integration_tests"
path = "tests/graph_security_integration_tests/mod.rs"
harness = true

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
debug-assertions = true
overflow-checks = true
incremental = true

# Workspace-wide only (per-crate `[profile.*]` is ignored). `beardog-installer` previously
# duplicated release with `lto = true` (fat LTO); workspace release uses thin LTO for
# faster builds. Use `--profile production` for fat LTO when shipping binaries.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = true
strip = "symbols"
panic = "abort"

[profile.bench]
inherits = "release"
debug = true
strip = "none"

[profile.production]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

[features]
# BTSP evolved to Unix socket JSON-RPC! HTTP API deprecated.
# default = ["btsp-api"]  # DEPRECATED: BTSP now uses Unix sockets
default = []
# FIDO2 support - Pure Rust (ecoBin compliant, zero C dependencies)
fido2 = ["beardog-security/fido2", "beardog-tunnel/ctap2", "dep:beardog-hid"]
# mDNS discovery support for primal-to-primal runtime discovery
mdns = ["beardog-core/mdns"]
# BTSP HTTP API DEPRECATED - evolved to Unix socket JSON-RPC!
# btsp-api = ["beardog-tunnel/btsp-api"]  # DEPRECATED: Use Unix socket BTSP instead
full = ["fido2", "mdns"]  # Removed btsp-api - BTSP now pure Unix sockets
