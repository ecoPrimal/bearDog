[package]
name = "beardog-tower-atomic"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Tower Atomic - cross-platform IPC JSON-RPC client for inter-primal communication"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["ipc", "json-rpc", "unix-sockets", "inter-primal", "tower-atomic"]
categories = ["network-programming", "asynchronous"]

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
beardog-types = { workspace = true }
beardog-errors = { workspace = true }
beardog-config = { workspace = true }
beardog-utils = { workspace = true }
cellmembrane-types = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
serial_test = { workspace = true }

[features]
default = []

